name: Проверка и сборка NickMadBox
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache-dependency-path: libcore/go.sum
      - name: Проверка исходников
        run: python tools/check_repository.py
      - name: Android SDK и NDK
        shell: pwsh
        run: |
          $sdk = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager.bat'
          & $sdk 'platforms;android-35' 'build-tools;35.0.1' 'ndk;28.2.13676358'
          if ($LASTEXITCODE) { throw 'SDK installation failed' }
          "sdk.dir=$($env:ANDROID_HOME.Replace('\','/'))" | Set-Content local.properties
          python tools/prepare_assets.py
      - name: Сборка ядра из закреплённых исходников
        shell: pwsh
        run: |
          $env:ANDROID_NDK_HOME = Join-Path $env:ANDROID_HOME 'ndk/28.2.13676358'
          ./buildScript/windows/Build-Libcore.ps1 -SdkRoot $env:ANDROID_HOME -JavaHome $env:JAVA_HOME
      - name: Проверки совместимости
        shell: pwsh
        run: |
          go -C libcore test -tags with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api ./configcompat ./connectiontest
          if ($LASTEXITCODE) { throw 'Tests failed' }
      - name: Сборка и проверка APK
        shell: pwsh
        run: |
          ./gradlew.bat --no-daemon --max-workers=2 app:assembleOssDebug
          if ($LASTEXITCODE) { throw 'APK build failed' }
          $apk = @(Get-ChildItem app/build/outputs/apk/oss/debug -Filter '*arm64-v8a*.apk')
          if ($apk.Count -ne 1) { throw 'Expected one ARM64 APK' }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          python tools/verify_apk.py $apk[0].FullName app/libs/libcore.aar artifacts/validation.json --runtime-label 1.14.4-nickmadbox.1
          if ($LASTEXITCODE) { throw 'Native APK validation failed' }
          python tools/unsigned_apk.py $apk[0].FullName artifacts/NickMadBox-ci-unsigned-arm64.apk
          'НЕПОДПИСАННЫЙ артефакт CI. Для установки используйте подписанные APK из Releases.' | Set-Content artifacts/README.txt
          Get-FileHash artifacts/NickMadBox-ci-unsigned-arm64.apk -Algorithm SHA256 | Format-List | Out-File artifacts/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NickMadBox-ci-unsigned-arm64
          path: artifacts/
